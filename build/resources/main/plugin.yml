name: BloodMoonLife
version: '1.0'

main: oi.papermc.bloodMoonLife.BloodMoonLife
api-version: '26.1.2'
load: POSTWORLD

authors: [ Bloody_daemonIV ]

commands:
  vote:
    usage: /vote <player>
  hire:
    usage: /hire <player>

  assassinreward:
    description: Reward the assassin and protect them from losing a life
    usage: /assassinreward
    permission: bloodmoonlife.admin

  election:
    description: Show the president, bodyguards and assassin
    usage: /election
    permission: bloodmoonlife.admin

  boogeyroll:
    description: Funky boogey
    usage: /election
    permission: bloodmoonlife.admin

  amiboogeyman:
    description: are you boogey?
    usage: /amiboogeyman